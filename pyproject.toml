[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metin2-qa"
version = "0.1.0"
description = "Metin2 AI QA Player: gerçek karakterle oyunu test eden otonom QA sistemi + Claude MCP entegrasyonu"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
metin2-qa = "qa.cli:main"
metin2-qa-mcp = "qa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
