# Metin2 AI QA yapılandırması
# Yerel değişiklikler için bu dosyayı qa.local.toml olarak kopyalayın (git'e girmez).

# dev | qa | staging  — "production" değerinde sistem çalışmayı reddeder
env = "qa"

scenarios_dir = "scenarios"
artifacts_dir = "artifacts"
db_path = "artifacts/qa.sqlite"
# Rapordaki commit/branch bilgisinin okunacağı Metin2 kaynak reposu
source_repo = "."

[bridge]
# "sim"      : in-process simülatör (kaynak kodu olmadan uçtan uca çalışır)
# "headless" : ekransız paket client — oyun client'ı olmadan gerçek sunucuya bağlanır ([headless])
# "tcp"      : Metin2_QA.exe'nin QA bridge'i (görsel/UI testleri için; veya `metin2-qa sim-server`)
mode = "sim"
host = "127.0.0.1"
port = 47800
timeout_s = 15.0

[bridge.agent_ports]
# Çoklu ajan (tcp): her ajan ayrı Metin2_QA.exe örneği → ayrı port. Tanımsızsa port + ajan sırası.
# AI_QA_001 = 47800
# AI_QA_002 = 47801

[accounts]
allowed_prefix = "AI_QA_"
default_account = "AI_QA_001"
# Gerçek ortamda şifreyi burada tutmayın: QA_ACCOUNT_PASSWORD ortam değişkeni önceliklidir
password = "qa"

[sim]
# Oracle'ı doğrulamak için bilinçli hata enjeksiyonu (bkz. `metin2-qa reference` -> sim_faults)
faults = []

[build]
cwd = "."
timeout_s = 3600
# Hedef adı -> komut (argv listesi, shell yok). Örnek:
# [build.commands]
# server = ["gmake", "-C", "/usr/metin2/src/server/game/src", "-j8"]
# db     = ["gmake", "-C", "/usr/metin2/src/server/db/src", "-j8"]
# client = ["msbuild", "C:/m2/client/Metin2Client.sln", "/p:Configuration=QA"]

[build.commands]

[server]
# start = ["sh", "/usr/metin2/qa/start.sh"]
# stop  = ["sh", "/usr/metin2/qa/stop.sh"]
start = []
stop = []
# integration/server/qa_event.cpp çıktısı (tcp modunda). Boşsa sunucu olayları bridge'den okunur.
# events_file = "/usr/metin2/qa/channel1/core1/qa_events.jsonl"
error_patterns = ["SYSERR", "Traceback", "QUEST_ERROR", "SQL error"]

[server.log_files]
# syserr = "/usr/metin2/qa/channel1/core1/syserr"
# syslog = "/usr/metin2/qa/channel1/core1/syslog"

[explorer]
# Otonom keşif ajanı. API anahtarı BURAYA YAZILMAZ: api_key_env'deki ortam değişkeninden okunur.
provider = "gemini"
fallback_provider = "codex_cli"   # Gemini günlük kotası dolunca yerel Codex CLI; ayrı oturum gerekir
model = "gemini-2.5-flash-lite"     # keşif modeli
api_key_env = "GEMINI_API_KEY"
temperature = 0.4
max_steps = 60                    # keşif başına oyuncu adımı bütçesi
max_total_tokens = 600000         # keşif başına token tavanı
history_turns = 10                # bağlamda tutulan son tur sayısı
thinking_budget = 0              # düşünme token'ları; 0 = kapalı
free_tier = true                  # ücretsiz katmanda gerçek maliyet 0 kaydedilir
requests_per_minute = 10         # dakikadaki en fazla istek; 0 = sınırsız
daily_request_limit = 900        # günlük istek tavanı
# daily_token_limit = 1000000     # isteğe bağlı günlük token tavanı
monthly_cost_limit_usd = 5       # yalnız ücretli katmanda geçerli
price_input_per_m = 0.10         # 1 milyon girdi token'ı için varsayımsal USD
price_output_per_m = 0.40        # 1 milyon çıktı token'ı için varsayımsal USD
price_cached_per_m = 0.025       # 1 milyon önbellek token'ı için varsayımsal USD

[selection]
# Değişikliğe göre test seçimi (metin2-qa affected / MCP run_affected).
# Varsayılan kurallar klasik Metin2 dosya adlarını kapsar (qa/config.py DEFAULT_SELECTION_RULES);
# buradaki kurallar onlara eklenir. Hedef: etiket, "scenario:<ad>" veya "*".
fallback = ["smoke"]
always = ["smoke"]

[selection.rules]
# "pet_*.cpp" = ["pet"]
# "offline_shop*" = ["shop", "scenario:offline_shop_basic"]

[daemon]
# 7/24 servis + web panel: `metin2-qa daemon`. Panel şifresi QA_PANEL_TOKEN ortam değişkeninde.
host = "127.0.0.1"               # 0.0.0.0 yapılırsa QA_PANEL_TOKEN zorunlu
port = 8765
max_parallel_jobs = 4            # gerçek sunucuda paralel iş (sim modunda her zaman 1)
snapshot_interval_s = 3.0
reconnect_backoff_s = [2, 5, 15, 60]
confirm_findings = true          # yeni bulguyu replay ile otomatik doğrula
confirm_times = 3
catalog = "catalog/systems.yaml"

# Sürekli açık AI oyuncular (varsayılan: AI_QA_001..004)
# [[daemon.agents]]
# account = "AI_QA_001"
# keep_online = true

# Zamanlanmış işler
# [[daemon.schedules]]
# name = "gece-kampanya"
# daily = "03:00"
# job = { type = "campaign" }
#
# [[daemon.schedules]]
# name = "saatlik-smoke"
# every = "1h"
# job = { type = "suite", tag = "smoke" }

[headless]
# Ekransız paket client ([bridge] mode = "headless")
auth_host = "127.0.0.1"
auth_port = 11002
game_host = "127.0.0.1"
channel = 1
profile = "profiles/metin2re.json"   # metin2-qa packets import ... -o profiles/metin2re.json
crypto = "none"                      # none | xtea (fork'a göre)
timeout_s = 15.0
walk_speed = 450.0                   # birim/sn — sunucunun hız kontrolüne takılmayacak değer
move_interval_ms = 250

[headless.channels]
"1" = 13000

# Konumdan harita numarası (sunucu map/<ad>/Setting.txt: BasePosition, MapSize*25600)
# [[headless.maps]]
# index = 1
# x = 409600
# y = 896000
# width = 102400
# height = 102400
