name: kill_mob_pickup
description: Yaban Köpeği (101) kes, düşen Köpek Dişi (30000) itemlerini topla, exp kazancını doğrula.
tags: [combat, item, drop]
covers: ["char_battle.cpp", "mob_manager.cpp", "item_manager.cpp"]
account: AI_QA_001
setup:
  - set_level: 10
  - give_item: {vnum: 27001, count: 5}
steps:
  - walk_to: {x: 7800, y: 7800}
  - kill_monster: {vnum: 101, count: 3}
    expect:
      - server_event: {name: MOB_KILL, min: 3}
      - client_event: {name: entity_dead, min: 3}
  - kill_until_drop: {vnum: 101, item_vnum: 30000, max_kills: 10}
assert:
  - inventory_contains: {vnum: 30000}
  - player: {field: exp, min: 1}
  - alive
